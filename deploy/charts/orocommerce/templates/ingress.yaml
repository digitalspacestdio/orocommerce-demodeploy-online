{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required (e.g. orocommerce.demodeploy.online)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orocommerce.fullname" . }}
  labels:
    {{- include "orocommerce.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # noindex / robots.txt are enforced by the app nginx ConfigMap
  # (files/default.conf.template). Do not use configuration-snippet here —
  # demodeploy ingress-nginx has allow-snippet-annotations=false.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "orocommerce.fullname" . }}-websocket
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "orocommerce.fullname" . }}-nginx
                port:
                  number: 80
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "orocommerce.fullname" . }}-tls
  {{- end }}
{{- end }}
{{- if and .Values.mailpit.enabled .Values.mailpit.exposeUI .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orocommerce.fullname" . }}-mailpit
  labels:
    {{- include "orocommerce.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ printf "mailpit-%s" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "orocommerce.fullname" . }}-mailpit
                port:
                  number: 8025
{{- end }}
