{{- if .Values.mailpit.enabled }}
{{- $ctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "mailpit" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orocommerce.fullname" . }}-mailpit
  labels:
    {{- include "orocommerce.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orocommerce.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orocommerce.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}:{{ .Values.mailpit.image.tag }}"
          imagePullPolicy: {{ .Values.mailpit.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "1"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "1"
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
{{- end }}
{{- if .Values.gotenberg.enabled }}
---
{{- $gctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "gotenberg" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orocommerce.fullname" . }}-gotenberg
  labels:
    {{- include "orocommerce.componentLabels" $gctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orocommerce.componentSelectorLabels" $gctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orocommerce.componentSelectorLabels" $gctx | nindent 8 }}
    spec:
      # staging ns has a Service named `api` (primebroker) that injects
      # API_PORT=tcp://… into every pod; gotenberg then misreads it as --api-port.
      enableServiceLinks: false
      containers:
        - name: gotenberg
          image: "{{ .Values.gotenberg.image.repository }}:{{ .Values.gotenberg.image.tag }}"
          imagePullPolicy: {{ .Values.gotenberg.image.pullPolicy }}
          env:
            - name: API_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
{{- end }}
