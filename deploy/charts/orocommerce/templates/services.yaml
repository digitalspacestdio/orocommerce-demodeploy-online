apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-fpm
  labels:
    {{- $ctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "fpm" }}
    {{- include "orocommerce.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: fpm
      port: 9000
      targetPort: fpm
  selector:
    {{- include "orocommerce.componentSelectorLabels" $ctx | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-nginx
  labels:
    {{- $nctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "nginx" }}
    {{- include "orocommerce.componentLabels" $nctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "orocommerce.componentSelectorLabels" $nctx | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-websocket
  labels:
    {{- $wctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "websocket" }}
    {{- include "orocommerce.componentLabels" $wctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: 8080
      targetPort: ws
  selector:
    {{- include "orocommerce.componentSelectorLabels" $wctx | nindent 4 }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-postgres
  labels:
    {{- $pctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "postgres" }}
    {{- include "orocommerce.componentLabels" $pctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "orocommerce.componentSelectorLabels" $pctx | nindent 4 }}
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-mailpit
  labels:
    {{- $mctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "mailpit" }}
    {{- include "orocommerce.componentLabels" $mctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
  selector:
    {{- include "orocommerce.componentSelectorLabels" $mctx | nindent 4 }}
{{- end }}
{{- if .Values.gotenberg.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orocommerce.fullname" . }}-gotenberg
  labels:
    {{- $gctx := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "gotenberg" }}
    {{- include "orocommerce.componentLabels" $gctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "orocommerce.componentSelectorLabels" $gctx | nindent 4 }}
{{- end }}
