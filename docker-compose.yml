# Local demo stack: OroCommerce CE 7.0.4 (unmodified) with demo data, in Docker only.
#
#   cp .env.example .env            # optional overrides
#   docker compose up -d            # first run: composer install + oro:install (20-40 min)
#   docker compose logs -f oro-install
#
# Everything is served by `oro-nginx` on http://localhost:8092:
#   /        storefront        /admin  back-office (admin / Admin1234!)
#   Mail UI: http://localhost:8026
#
# The upstream Symfony local-server compose file shipped with the application was replaced
# by this stack; it is still available as `git show 7.0.4:docker-compose.yml`.
name: orodemo

include:
  - path: docker/compose/infrastructure.yml
  - path: docker/compose/orocommerce.yml
